on:
  workflow_dispatch:

  push:
    branches:
      - 'main'
      - 'test-ci'

  pull_request:

name: Upload Pdzs in Release Asset

jobs:
  build:
    permissions:
        contents: write
    name: Make Zips and Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build project
        run: |
          ./export.sh

      - name: Upload Release Asset
        id: upload-release-asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            for pdz in ./export2/*.pdz; do gh release upload --clobber export $pdz; done
